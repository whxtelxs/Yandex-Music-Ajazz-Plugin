<!doctype html>
<html lang="ru" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="csp-nonce" content="__CSP_NONCE__">
    <link rel="icon" href="/assets/logo.svg">
    <title>Yandex Music Ajazz Plugin</title>
    <link href="/assets/panel.css" rel="stylesheet">
    <script src="/assets/panel.js" defer></script>
</head>
<body class="h-dvh overflow-hidden bg-background font-sans text-foreground antialiased">
    <div id="root" class="h-full">
        <main class="panel-loading" role="status" aria-live="polite" aria-busy="true">
            <img class="panel-loading-logo" src="/assets/logo.svg" alt="" width="56" height="56">
            <h1 class="panel-loading-title">Yandex Music</h1>
            <div class="panel-loading-status">
                <svg class="panel-loading-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" opacity="0.15"></circle>
                    <path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
                <p class="settings-description">Загрузка настроек</p>
            </div>
        </main>
    </div>
    <noscript>Для панели настроек нужен JavaScript.</noscript>
</body>
</html>
